plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.svenuks.imsforpixel'
    compileSdk 36

    defaultConfig {
        applicationId "com.svenuks.imsforpixel"
        minSdk 29
        targetSdk 36
        // Match stable 1.2.1 for reversible side-loaded testing with the same signing key.
        versionCode 12
        versionName "1.2.2-data-test4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Kadb's certificate code is Java 21; Android compilation stays at 17.
            javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
    }

    def publishKeystore = providers.environmentVariable("PIXEL_IMS_KEYSTORE_FILE").orNull
    signingConfigs {
        if (publishKeystore != null) {
            publication {
                storeFile file(publishKeystore)
                storePassword providers.environmentVariable("PIXEL_IMS_KEYSTORE_PASSWORD").get()
                keyAlias providers.environmentVariable("PIXEL_IMS_KEY_ALIAS").get()
                keyPassword providers.environmentVariable("PIXEL_IMS_KEY_PASSWORD").get()
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig publishKeystore != null ? signingConfigs.publication : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    // Kadb uses this at runtime; expose it only to the pairing smoke tests.
    testImplementation 'com.github.Flyfish233:spake2-java:1.0.5'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.1'
    
    // Compose
    implementation platform('androidx.compose:compose-bom:2026.03.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'

    // Hidden API bypass
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'

    // ADB protocol library for local wireless debugging
    implementation 'com.flyfishxu:kadb:2.1.1'
}
