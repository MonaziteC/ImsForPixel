name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleRelease testDebugUnitTest lintRelease
      - run: python3 scripts/check-release-apk.py app/build/outputs/apk/release/app-release.apk --max-bytes 24226126
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-ims-release-test
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/*.txt
